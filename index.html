<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Exam User List</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-glow page-glow-left"></div>
    <div class="page-glow page-glow-right"></div>

    <main class="app-shell">
      <section class="hero-card">
        <p class="eyebrow">AI Exam</p>
        <h1>登录后查看用户列表</h1>
        <p class="hero-copy">
          用户信息由 Vercel API 从 Neon 数据库读取，登录成功后展示当前用户详情和全部用户列表。
        </p>
      </section>

      <section class="panel login-panel" id="login-panel">
        <div class="panel-header">
          <p class="section-kicker">Sign In</p>
          <h2>用户登录</h2>
        </div>

        <form id="login-form" class="form-stack">
          <label class="field">
            <span>用户名</span>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required />
          </label>

          <label class="field">
            <span>密码</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="请输入密码"
              required
            />
          </label>

          <button class="primary-button" type="submit">登录</button>
          <p id="login-message" class="form-message" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel dashboard hidden" id="dashboard-panel">
        <div class="dashboard-topbar">
          <div>
            <p class="section-kicker">Profile</p>
            <h2>当前用户信息</h2>
          </div>
          <button id="logout-button" class="ghost-button" type="button">退出登录</button>
        </div>

        <div class="profile-layout">
          <div class="avatar-card">
            <img id="avatar-image" class="avatar-image" alt="用户头像" />
            <p class="avatar-note">头像使用当前用户姓名生成。</p>
          </div>

          <div class="info-card">
            <div class="info-hero">
              <p id="user-role" class="role-pill"></p>
              <h3 id="display-name"></h3>
              <p id="user-bio" class="user-bio"></p>
            </div>

            <dl class="info-grid">
              <div>
                <dt>用户编号</dt>
                <dd id="user-id"></dd>
              </div>
              <div>
                <dt>部门</dt>
                <dd id="user-department"></dd>
              </div>
              <div>
                <dt>邮箱</dt>
                <dd id="user-email"></dd>
              </div>
              <div>
                <dt>手机</dt>
                <dd id="user-phone"></dd>
              </div>
              <div>
                <dt>所在地</dt>
                <dd id="user-location"></dd>
              </div>
              <div>
                <dt>状态</dt>
                <dd id="last-login"></dd>
              </div>
            </dl>
          </div>
        </div>

        <div class="list-card">
          <div class="list-card-header">
            <div>
              <p class="section-kicker">Users</p>
              <h3>用户信息列表</h3>
            </div>
            <span id="users-count" class="users-count"></span>
          </div>
          <div id="users-grid" class="users-grid"></div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
